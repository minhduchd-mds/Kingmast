name: Physical Bench Preparation

on:
  push:
    branches: [main]
    paths:
      - 'docs/validation/hardware/V006_PHYSICAL_BENCH_EXECUTION_PACK.json'
      - 'docs/validation/hardware/V006_PHYSICAL_BENCH_RUNBOOK.md'
      - 'docs/validation/hardware/V006_HARDWARE_QUALIFICATION_MATRIX.json'
      - 'docs/validation/sensors/V006_SENSOR_CALIBRATION_LIFECYCLE.json'
      - 'docs/validation/hil/V006_HIL_EXECUTION_MANIFEST.json'
      - 'docs/validation/hil/V006_HIL_EVIDENCE_REGISTRY.json'
      - 'docs/validation/runtime/V006_TARGET_SOAK_CAPTURE.json'
      - 'docs/validation/V006_RELEASE_QUALIFICATION_MATRIX.json'
      - 'scripts/physical-bench-execution-pack-check.mjs'
      - 'scripts/release-qualification-check.mjs'
      - '.github/workflows/physical-bench-preparation.yml'
  pull_request:
    paths:
      - 'docs/validation/hardware/V006_PHYSICAL_BENCH_EXECUTION_PACK.json'
      - 'docs/validation/hardware/V006_PHYSICAL_BENCH_RUNBOOK.md'
      - 'docs/validation/hardware/V006_HARDWARE_QUALIFICATION_MATRIX.json'
      - 'docs/validation/sensors/V006_SENSOR_CALIBRATION_LIFECYCLE.json'
      - 'docs/validation/hil/V006_HIL_EXECUTION_MANIFEST.json'
      - 'docs/validation/hil/V006_HIL_EVIDENCE_REGISTRY.json'
      - 'docs/validation/runtime/V006_TARGET_SOAK_CAPTURE.json'
      - 'docs/validation/V006_RELEASE_QUALIFICATION_MATRIX.json'
      - 'scripts/physical-bench-execution-pack-check.mjs'
      - 'scripts/release-qualification-check.mjs'
      - '.github/workflows/physical-bench-preparation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kingmast-physical-bench-preparation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench-preparation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Validate physical bench execution pack
        run: node scripts/physical-bench-execution-pack-check.mjs
      - name: Generate fail-closed bench readiness evidence
        run: |
          node scripts/physical-bench-execution-pack-check.mjs --json > "$RUNNER_TEMP/kingmast.physical-bench-readiness.json"
          node -e "const r=require(process.env.RUNNER_TEMP+'/kingmast.physical-bench-readiness.json'); if(r.schema!=='kingmast-physical-bench-readiness-report/v2'||r.controlAuthority!=='none'||r.softwarePreparationScorePercent!==100||r.physicalExecutionCompletionScorePercent!==0||r.roles!==10||r.logicalInterfaces!==7||r.provisionTargets!==7||r.calibrationGroups!==4||r.hilScenarios!==12||r.canTxPathPresent!==false||r.physicalBenchExecuted!==false||r.physicalHilExecuted!==false||r.targetHardwareQualified!==false||r.closedTrackApproved!==false||r.publicRoadApproved!==false||r.failures.length!==0) process.exit(1); console.log('KINGMAST bench preparation: software 100%, physical execution 0%; all physical evidence remains pending.');"
      - name: Upload physical bench preparation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kingmast-physical-bench-preparation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/kingmast.physical-bench-readiness.json
            docs/validation/hardware/V006_PHYSICAL_BENCH_EXECUTION_PACK.json
            docs/validation/hardware/V006_PHYSICAL_BENCH_RUNBOOK.md
          if-no-files-found: error
          retention-days: 14
