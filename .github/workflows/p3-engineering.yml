name: P3 Engineering Parallel

on:
  push:
    branches: [main]
    paths:
      - 'autonomy-lab/digital-twin/**'
      - 'autonomy-lab/hil/**'
      - 'autonomy-lab/safety-sim/**'
      - 'docs/architecture/P3_LOGICAL_SERVICE_MAP.json'
      - 'docs/validation/PHYSICAL_EVIDENCE_TRUST_CHAIN_V006.md'
      - 'docs/validation/QUALIFICATION_READINESS_DASHBOARD_V006.md'
      - 'docs/validation/V006_RELEASE_QUALIFICATION_MATRIX.json'
      - 'docs/validation/hardware/**'
      - 'docs/validation/sensors/**'
      - 'docs/validation/hil/**'
      - 'docs/validation/closed-track/**'
      - 'docs/validation/runtime/P0_P6_PHYSICAL_RUNTIME_V006.md'
      - 'scripts/p3-logical-service-map-check.mjs'
      - 'scripts/p0-p6-physical-runtime-policy-check.mjs'
      - 'scripts/external-simulator-workflow-policy-check.mjs'
      - 'scripts/hardware-qualification-matrix-check.mjs'
      - 'scripts/sensor-calibration-lifecycle-check.mjs'
      - 'scripts/qualification-readiness-report.mjs'
      - 'scripts/lib/physical-evidence-manifest.mjs'
      - 'scripts/physical-evidence-*.mjs'
      - 'scripts/hil-physical-capture-package.mjs'
      - 'scripts/hil-evidence-package-check.mjs'
      - 'scripts/closed-track-physical-capture-package.mjs'
      - 'services/risk-engine/src/runtime-health-supervisor*'
      - 'services/risk-engine/src/runtime-health-evidence-cli.ts'
      - 'services/risk-engine/src/physical-validation-runtime*'
      - 'package.json'
      - '.github/workflows/p3-engineering.yml'
      - '.github/workflows/external-simulator-evidence.yml'
      - '.github/workflows/hil-physical-evidence.yml'
      - '.github/workflows/closed-track-evidence.yml'
  pull_request:
    paths:
      - 'autonomy-lab/digital-twin/**'
      - 'autonomy-lab/hil/**'
      - 'autonomy-lab/safety-sim/**'
      - 'docs/architecture/P3_LOGICAL_SERVICE_MAP.json'
      - 'docs/validation/PHYSICAL_EVIDENCE_TRUST_CHAIN_V006.md'
      - 'docs/validation/QUALIFICATION_READINESS_DASHBOARD_V006.md'
      - 'docs/validation/V006_RELEASE_QUALIFICATION_MATRIX.json'
      - 'docs/validation/hardware/**'
      - 'docs/validation/sensors/**'
      - 'docs/validation/hil/**'
      - 'docs/validation/closed-track/**'
      - 'docs/validation/runtime/P0_P6_PHYSICAL_RUNTIME_V006.md'
      - 'scripts/p3-logical-service-map-check.mjs'
      - 'scripts/p0-p6-physical-runtime-policy-check.mjs'
      - 'scripts/external-simulator-workflow-policy-check.mjs'
      - 'scripts/hardware-qualification-matrix-check.mjs'
      - 'scripts/sensor-calibration-lifecycle-check.mjs'
      - 'scripts/qualification-readiness-report.mjs'
      - 'scripts/lib/physical-evidence-manifest.mjs'
      - 'scripts/physical-evidence-*.mjs'
      - 'scripts/hil-physical-capture-package.mjs'
      - 'scripts/hil-evidence-package-check.mjs'
      - 'scripts/closed-track-physical-capture-package.mjs'
      - 'services/risk-engine/src/runtime-health-supervisor*'
      - 'services/risk-engine/src/runtime-health-evidence-cli.ts'
      - 'services/risk-engine/src/physical-validation-runtime*'
      - 'package.json'
      - '.github/workflows/p3-engineering.yml'
      - '.github/workflows/external-simulator-evidence.yml'
      - '.github/workflows/hil-physical-evidence.yml'
      - '.github/workflows/closed-track-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kingmast-p3-engineering-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p3-engineering:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install reproducibly
        run: pnpm install --frozen-lockfile
      - name: Generate 500+ case safety campaign
        run: |
          node autonomy-lab/safety-sim/generate-scenario-campaign.mjs --json --ci > "$RUNNER_TEMP/kingmast.scenario-campaign.json"
          node -e "const r=require(process.env.RUNNER_TEMP+'/kingmast.scenario-campaign.json'); if(r.schema!=='kingmast-safety-scenario-campaign/v1'||r.controlAuthority!=='none'||r.campaignCaseCount<500||r.externalSimulatorExecuted!==false||r.physicalHilExecuted!==false||r.closedTrackExecuted!==false||r.publicRoadApproved!==false) process.exit(1); console.log('KINGMAST planned safety campaign '+r.campaignCaseCount+' cases across '+r.profileCount+' environment profiles; execution remains pending.');"
      - name: Digital-twin external simulator contract
        run: pnpm --silent sim:digital-twin-contract
      - name: External simulator runner contract
        run: pnpm --silent sim:external-runner-contract
      - name: External simulator evidence trust-chain self-test
        run: |
          pnpm --silent sim:external-evidence-selftest -- --json > "$RUNNER_TEMP/kingmast.external-evidence-selftest.json"
          node -e "const r=require(process.env.RUNNER_TEMP+'/kingmast.external-evidence-selftest.json'); if(r.schema!=='kingmast-external-simulator-evidence-toolchain-selftest/v1'||r.controlAuthority!=='none'||r.externalSimulatorExecuted!==false||r.physicalHilExecuted!==false||r.closedTrackExecuted!==false||r.targetHardwareQualified!==false||r.publicRoadApproved!==false||r.total<6||r.failed!==0||r.allPassed!==true) process.exit(1); console.log('KINGMAST external simulator evidence toolchain self-test passed '+r.passed+'/'+r.total+' checks; external execution remains false.');"
      - name: Cross-simulator comparator fixture self-test
        run: |
          node autonomy-lab/digital-twin/compare-simulator-results.mjs --fixtures --json --ci > "$RUNNER_TEMP/kingmast.cross-simulator-fixture.json"
          node -e "const r=require(process.env.RUNNER_TEMP+'/kingmast.cross-simulator-fixture.json'); if(r.schema!=='kingmast-cross-simulator-parity-report/v1'||r.controlAuthority!=='none'||r.fixtureMode!==true||r.externalSimulatorEvidence!==false||r.commonScenarioCount<8||r.failed!==0||r.allPassed!==true||r.physicalHilExecuted!==false||r.closedTrackExecuted!==false) process.exit(1); console.log('KINGMAST cross-simulator comparator self-test passed '+r.passed+'/'+r.commonScenarioCount+' fixture cases; no external simulator claim.');"
      - name: External simulator execution workflow policy
        run: pnpm --silent sim:external-workflow-policy
      - name: Physical evidence trust-chain self-test
        run: |
          pnpm --silent evidence:physical-trust-selftest -- --json --ci > "$RUNNER_TEMP/kingmast.physical-evidence-trust-selftest.json"
          node -e "const r=require(process.env.RUNNER_TEMP+'/kingmast.physical-evidence-trust-selftest.json'); if(r.schema!=='kingmast-physical-evidence-trust-selftest/v1'||r.controlAuthority!=='none'||r.fixtureOnly!==true||r.physicalEvidenceCaptured!==false||r.targetHardwareQualified!==false||r.closedTrackApproved!==false||r.publicRoadApproved!==false||r.total<8||r.failed!==0||r.allPassed!==true) process.exit(1); console.log('KINGMAST physical evidence trust-chain self-test passed '+r.passed+'/'+r.total+' fixture checks; no physical result is claimed.');"
      - name: Physical HIL and controlled-track workflow policy
        run: pnpm --silent evidence:physical-workflow-policy
      - name: Hardware qualification matrix honesty policy
        run: pnpm --silent qualification:hardware-matrix
      - name: Sensor calibration lifecycle honesty policy
        run: pnpm --silent qualification:sensor-calibration
      - name: Qualification readiness dashboard
        run: |
          pnpm --silent qualification:readiness > "$RUNNER_TEMP/kingmast.qualification-readiness.json"
          node -e "const r=require(process.env.RUNNER_TEMP+'/kingmast.qualification-readiness.json'); if(r.schema!=='kingmast-qualification-readiness-report/v1'||r.controlAuthority!=='none'||r.qualificationClaim!=='software-readiness-dashboard-not-physical-qualification'||r.automaticQualification!==false||r.targetHardwareQualified!==false||r.physicalVehicleComputerQualified!==false||r.closedTrackApproved!==false||r.publicRoadApproved!==false||r.softwarePreparationScorePercent!==100||r.physicalEvidenceCompletionScorePercent<0||r.physicalEvidenceCompletionScorePercent>100||r.coverage?.hil?.total!==12||r.coverage?.closedTrack?.total<8) process.exit(1); console.log('KINGMAST qualification readiness: software preparation '+r.softwarePreparationScorePercent+'%, reviewed physical evidence '+r.physicalEvidenceCompletionScorePercent+'%; qualification remains false.');"
      - name: P3 logical service architecture
        run: pnpm --silent architecture:p3-service-map
      - name: P0-P6 physical runtime fail-closed gate
        run: pnpm --silent qualification:p0-p6
      - name: Virtual HIL stimulus plan
        run: node autonomy-lab/hil/validate-virtual-hil-plan.mjs
      - name: Runtime health supervisor unit tests
        run: pnpm --filter @kingmast/risk-engine exec vitest run src/runtime-health-supervisor.test.ts
      - name: Runtime health supervisor evidence
        run: |
          pnpm --silent runtime:health-evidence > "$RUNNER_TEMP/kingmast.runtime-health.json"
          node -e "const r=require(process.env.RUNNER_TEMP+'/kingmast.runtime-health.json'); if(r.schema!=='kingmast-runtime-health-evidence/v1'||r.controlAuthority!=='none'||r.automaticActuation!==false||r.canWriteAuthority!==false||r.targetHardwareQualified!==false||r.physicalVehicleComputerTest!==false||r.total<5||r.failed!==0||r.allPassed!==true) process.exit(1); console.log('KINGMAST runtime health supervisor passed '+r.passed+'/'+r.total+' deterministic states with no actuation authority.');"
      - name: Upload P3 engineering software evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kingmast-p3-engineering-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/kingmast.scenario-campaign.json
            ${{ runner.temp }}/kingmast.external-evidence-selftest.json
            ${{ runner.temp }}/kingmast.cross-simulator-fixture.json
            ${{ runner.temp }}/kingmast.physical-evidence-trust-selftest.json
            ${{ runner.temp }}/kingmast.qualification-readiness.json
            ${{ runner.temp }}/kingmast.runtime-health.json
            docs/architecture/P3_LOGICAL_SERVICE_MAP.json
            docs/validation/PHYSICAL_EVIDENCE_TRUST_CHAIN_V006.md
            docs/validation/QUALIFICATION_READINESS_DASHBOARD_V006.md
            docs/validation/hardware/V006_HARDWARE_QUALIFICATION_MATRIX.json
            docs/validation/sensors/V006_SENSOR_CALIBRATION_LIFECYCLE.json
            docs/validation/runtime/P0_P6_PHYSICAL_RUNTIME_V006.md
            autonomy-lab/digital-twin/external-simulator-contract.json
            autonomy-lab/digital-twin/runner-contract.json
          if-no-files-found: error
          retention-days: 14
