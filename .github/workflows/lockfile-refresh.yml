name: Lockfile Refresh

on:
  push:
    branches:
      - upgrade/next16-ts7-2026
    paths:
      - package.json
      - apps/hmi/package.json
      - .github/workflows/lockfile-refresh.yml

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.34.0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - name: Regenerate lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Verify regenerated lockfile
        run: pnpm install --frozen-lockfile
      - name: Upload lockfile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kingmast-next16-ts7-lockfile
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1
