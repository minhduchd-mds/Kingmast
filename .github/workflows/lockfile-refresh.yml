name: Lockfile Refresh

on:
  push:
    branches:
      - upgrade/next16-ts7-2026
    paths:
      - package.json
      - apps/hmi/package.json
      - .github/workflows/lockfile-refresh.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout upgrade branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: upgrade/next16-ts7-2026
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.34.0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - name: Regenerate and verify lockfile
        run: |
          pnpm install --lockfile-only --no-frozen-lockfile
          pnpm install --frozen-lockfile
      - name: Commit lockfile only
        run: |
          git config user.name "kingmast-upgrade-bot"
          git config user.email "29146304+minhduchd-mds@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already current."
            exit 0
          fi
          git commit -m "deps(platform): regenerate lockfile for Next 16 and TypeScript 7"
          git push origin HEAD:upgrade/next16-ts7-2026
