name: Target Hardware Capture

on:
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: Continuous soak duration on the physical target
        required: true
        type: choice
        default: '7200'
        options:
          - '7200'
          - '14400'
          - '21600'
          - '43200'
      hardware_target:
        description: Bounded target model label, not a serial number
        required: true
        type: string
      hardware_instance_sha256:
        description: SHA-256 fingerprint of the local hardware instance identifier
        required: true
        type: string
      firmware_revision:
        description: Firmware revision label
        required: true
        type: string
      configuration_revision:
        description: Configuration revision label
        required: true
        type: string
      calibration_revision:
        description: Calibration revision label
        required: true
        type: string
      require_thermal_telemetry:
        description: Require readable Linux thermal-zone telemetry
        required: true
        type: choice
        default: '1'
        options:
          - '1'
          - '0'
      max_temp_c:
        description: Maximum aggregate thermal-zone temperature budget in Celsius
        required: true
        type: string
        default: '85'
      min_free_memory_mib:
        description: Minimum observed free memory budget in MiB
        required: true
        type: string
        default: '256'
      acknowledge_evidence_only:
        description: I understand this capture is evidence only and does not qualify hardware or authorize road use
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: kingmast-target-hardware-capture
  cancel-in-progress: false

jobs:
  capture:
    if: ${{ inputs.acknowledge_evidence_only == true }}
    runs-on: [self-hosted, linux, kingmast-target]
    environment: target-hardware-evidence
    timeout-minutes: 750
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - name: Validate capture inputs
        env:
          KINGMAST_INPUT_DURATION: ${{ inputs.duration_seconds }}
          KINGMAST_INPUT_HARDWARE_TARGET: ${{ inputs.hardware_target }}
          KINGMAST_INPUT_HARDWARE_INSTANCE_SHA256: ${{ inputs.hardware_instance_sha256 }}
          KINGMAST_INPUT_FIRMWARE_REVISION: ${{ inputs.firmware_revision }}
          KINGMAST_INPUT_CONFIGURATION_REVISION: ${{ inputs.configuration_revision }}
          KINGMAST_INPUT_CALIBRATION_REVISION: ${{ inputs.calibration_revision }}
          KINGMAST_INPUT_MAX_TEMP_C: ${{ inputs.max_temp_c }}
          KINGMAST_INPUT_MIN_FREE_MEMORY_MIB: ${{ inputs.min_free_memory_mib }}
        run: |
          node <<'NODE'
          const label=/^[A-Za-z0-9][A-Za-z0-9._:+/@-]{0,95}$/;
          const sha=/^[a-f0-9]{64}$/i;
          const duration=Number(process.env.KINGMAST_INPUT_DURATION);
          const maxTemp=Number(process.env.KINGMAST_INPUT_MAX_TEMP_C);
          const minFree=Number(process.env.KINGMAST_INPUT_MIN_FREE_MEMORY_MIB);
          const labels=['KINGMAST_INPUT_HARDWARE_TARGET','KINGMAST_INPUT_FIRMWARE_REVISION','KINGMAST_INPUT_CONFIGURATION_REVISION','KINGMAST_INPUT_CALIBRATION_REVISION'];
          if(![7200,14400,21600,43200].includes(duration))throw new Error('unsupported target soak duration');
          if(!sha.test(process.env.KINGMAST_INPUT_HARDWARE_INSTANCE_SHA256??''))throw new Error('hardware instance must be a SHA-256 fingerprint');
          for(const name of labels)if(!label.test(process.env[name]??''))throw new Error(`${name} is not a bounded label`);
          if(!Number.isFinite(maxTemp)||maxTemp<40||maxTemp>150)throw new Error('max temperature must be 40..150 C');
          if(!Number.isFinite(minFree)||minFree<0||minFree>65536)throw new Error('minimum free memory must be 0..65536 MiB');
          NODE
      - name: Install reproducibly
        run: pnpm install --frozen-lockfile
      - name: Repository and target safety gates
        run: |
          pnpm security:secrets
          pnpm security:workflow-policy
          pnpm safety:boundary
          pnpm qualification:target-soak
      - name: Execute physical target soak capture
        env:
          KINGMAST_PHYSICAL_VEHICLE_COMPUTER_TEST: '1'
          KINGMAST_HOST_SOAK_SECONDS: ${{ inputs.duration_seconds }}
          KINGMAST_PRODUCT_VERSION: 0.0.6
          KINGMAST_BUILD_COMMIT: ${{ github.sha }}
          KINGMAST_BUILD_ID: target-${{ github.run_id }}-${{ github.run_attempt }}
          KINGMAST_HARDWARE_TARGET: ${{ inputs.hardware_target }}
          KINGMAST_HARDWARE_INSTANCE_SHA256: ${{ inputs.hardware_instance_sha256 }}
          KINGMAST_FIRMWARE_REVISION: ${{ inputs.firmware_revision }}
          KINGMAST_CONFIGURATION_REVISION: ${{ inputs.configuration_revision }}
          KINGMAST_CALIBRATION_REVISION: ${{ inputs.calibration_revision }}
          KINGMAST_REQUIRE_THERMAL_TELEMETRY: ${{ inputs.require_thermal_telemetry }}
          KINGMAST_HOST_SOAK_MAX_TEMP_C: ${{ inputs.max_temp_c }}
          KINGMAST_HOST_SOAK_MIN_FREE_MEMORY_MIB: ${{ inputs.min_free_memory_mib }}
        run: pnpm performance:host-soak > /tmp/kingmast.target-host-soak.json
      - name: Validate physical soak capture
        run: |
          node <<'NODE'
          const r=require('/tmp/kingmast.target-host-soak.json');
          if(r.schema!=='kingmast-host-soak-report/v1'||r.controlAuthority!=='none'||r.qualificationClaim!=='physical-target-host-soak-capture-only-not-qualification'||r.targetHardwareQualified!==false||r.physicalVehicleComputerTest!==true||r.physicalPreflight?.passed!==true||r.classification?.passed!==true||r.memory?.passed!==true||r.eventLoop?.passed!==true||r.runtimeEnvelope?.passed!==true||r.allPassed!==true||r.workload?.durationSeconds<7200)process.exit(1);
          console.log(`KINGMAST physical target soak evidence passed ${r.workload.durationSeconds}s; hardware qualification remains false.`);
          NODE
      - name: Capture fresh bounded target runtime diagnostics source
        env:
          KINGMAST_TARGET_DIAGNOSTICS_URL: http://127.0.0.1:4000
          KINGMAST_TARGET_VIEWER_TOKEN: ${{ secrets.KINGMAST_TARGET_VIEWER_TOKEN }}
          KINGMAST_TARGET_EDGE_TOKEN: ${{ secrets.KINGMAST_TARGET_EDGE_TOKEN }}
          KINGMAST_TARGET_FIELD_RUNTIME_PATH: /tmp/kingmast.target-field-runtime.json
        run: node scripts/capture-target-field-runtime.mjs
      - name: Validate bounded target runtime diagnostics source
        run: |
          runtime=/tmp/kingmast.target-field-runtime.json
          if [ ! -f "$runtime" ] || [ -L "$runtime" ]; then
            echo "Missing regular physical diagnostics source: $runtime" >&2
            exit 1
          fi
          bytes=$(wc -c < "$runtime")
          if [ "$bytes" -gt 65536 ]; then
            echo "Physical diagnostics source exceeds 64 KiB bound" >&2
            exit 1
          fi
          node -e "const r=require('/tmp/kingmast.target-field-runtime.json'); if(r.coverage?.sensorAges!==true||r.coverage?.edgeRejectedPackets!==true)process.exit(1); console.log('Fresh bounded physical diagnostics source accepted with core runtime coverage.');"
      - name: Capture physical field diagnostics
        env:
          KINGMAST_PHYSICAL_VEHICLE_COMPUTER_TEST: '1'
          KINGMAST_REQUIRE_PHYSICAL_FIELD_CAPTURE: '1'
          KINGMAST_PRODUCT_VERSION: 0.0.6
          KINGMAST_BUILD_COMMIT: ${{ github.sha }}
          KINGMAST_BUILD_ID: target-${{ github.run_id }}-${{ github.run_attempt }}
          KINGMAST_HARDWARE_TARGET: ${{ inputs.hardware_target }}
          KINGMAST_HARDWARE_INSTANCE_SHA256: ${{ inputs.hardware_instance_sha256 }}
          KINGMAST_FIRMWARE_REVISION: ${{ inputs.firmware_revision }}
          KINGMAST_CONFIGURATION_REVISION: ${{ inputs.configuration_revision }}
          KINGMAST_CALIBRATION_REVISION: ${{ inputs.calibration_revision }}
        run: |
          export KINGMAST_FIELD_DIAGNOSTICS_INPUT_JSON="$(cat /tmp/kingmast.target-field-runtime.json)"
          pnpm --silent diagnostics:field-evidence > /tmp/kingmast.target-field-diagnostics.json
      - name: Validate physical field diagnostics
        run: |
          node <<'NODE'
          const r=require('/tmp/kingmast.target-field-diagnostics.json');
          const p=r.privacy||{};
          if(r.schema!=='kingmast-field-diagnostics-report/v1'||r.controlAuthority!=='none'||r.qualificationClaim!=='physical-target-diagnostic-capture-only-not-qualification'||r.targetHardwareQualified!==false||r.physicalVehicleComputerTest!==true||r.physicalCaptureReady!==true||r.identity?.complete!==true||r.identity?.hardwareInstanceIsHashed!==true||r.health?.coverage?.physicalCoreCoverageComplete!==true||r.allPassed!==true||p.rawCabinVideoIncluded!==false||p.rawCameraFramesIncluded!==false||p.preciseCoordinatesIncluded!==false||p.requestPayloadsIncluded!==false||p.secretsIncluded!==false||p.rawHardwareSerialIncluded!==false)process.exit(1);
          console.log(`KINGMAST physical field diagnostics capture passed; provider coverage complete=${r.health.coverage.providerCoverageComplete}; qualification remains false.`);
          NODE
      - name: Generate bounded capture manifest
        env:
          KINGMAST_RUN_ID: ${{ github.run_id }}
          KINGMAST_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          node <<'NODE'
          const {createHash}=require('node:crypto');
          const {readFileSync,writeFileSync}=require('node:fs');
          const soakRaw=readFileSync('/tmp/kingmast.target-host-soak.json');
          const diagnosticsRaw=readFileSync('/tmp/kingmast.target-field-diagnostics.json');
          const r=JSON.parse(soakRaw.toString('utf8'));
          const d=JSON.parse(diagnosticsRaw.toString('utf8'));
          const manifest={
            schema:'kingmast-target-hardware-artifact-manifest/v2',
            generatedAt:new Date().toISOString(),
            controlAuthority:'none',
            sourceCommit:process.env.GITHUB_SHA,
            workflowRunId:process.env.KINGMAST_RUN_ID,
            workflowRunAttempt:process.env.KINGMAST_RUN_ATTEMPT,
            hostSoakReportSha256:createHash('sha256').update(soakRaw).digest('hex'),
            fieldDiagnosticsReportSha256:createHash('sha256').update(diagnosticsRaw).digest('hex'),
            physicalVehicleComputerTest:true,
            targetHardwareQualified:false,
            identity:r.physicalPreflight.identity,
            capturedDurationSeconds:r.workload.durationSeconds,
            classificationPassed:r.classification.passed,
            memoryPassed:r.memory.passed,
            eventLoopPassed:r.eventLoop.passed,
            runtimeEnvelopePassed:r.runtimeEnvelope.passed,
            physicalDiagnosticsCaptureReady:d.physicalCaptureReady,
            physicalDiagnosticsCoreCoverageComplete:d.health.coverage.physicalCoreCoverageComplete,
            providerDiagnosticsCoverageComplete:d.health.coverage.providerCoverageComplete,
            providerAuthRejectedInstrumented:d.health.coverage.providerAuthRejected,
            thermalTelemetryRequired:r.physicalPreflight.requireThermalTelemetry,
            thermalAvailable:r.runtimeEnvelope.thermal.available,
            temperaturePassed:r.runtimeEnvelope.thermal.temperaturePassed,
            freeMemoryPassed:r.runtimeEnvelope.memory.passed,
            reviewStatus:'pending-independent-review',
            privacy:{rawHardwareSerialIncluded:false,hostnameIncluded:false,networkAddressesIncluded:false,processArgumentsIncluded:false,environmentIncluded:false,preciseCoordinatesIncluded:false,rawCameraFramesIncluded:false,rawCabinVideoIncluded:false,secretsIncluded:false},
          };
          writeFileSync('/tmp/kingmast.target-hardware-manifest.json',JSON.stringify(manifest,null,2)+'\n');
          NODE
      - name: Upload target evidence package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kingmast-target-hardware-evidence-${{ github.run_id }}
          path: |
            /tmp/kingmast.target-host-soak.json
            /tmp/kingmast.target-field-diagnostics.json
            /tmp/kingmast.target-hardware-manifest.json
          if-no-files-found: error
          retention-days: 30
