name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - name: Repository secret scan
        run: pnpm security:secrets
      - name: Workflow supply-chain policy
        run: pnpm security:workflow-policy
      - name: Configuration auth policy
        run: pnpm security:config-auth
      - name: Provider identity policy
        run: pnpm security:provider-auth
      - name: Audit integrity policy
        run: pnpm audit:integrity
      - name: Firmware security policy
        run: pnpm firmware:policy
      - name: Firmware trust evidence honesty gate
        run: pnpm firmware:evidence
      - name: Physical boot security evidence honesty gate
        run: pnpm boot:evidence
      - name: A/B recovery policy
        run: pnpm ota:recovery-policy
      - name: Release identity and evidence policy
        run: pnpm release:identity-policy
      - name: Detached evidence signing self-test
        run: pnpm evidence:signing-selftest
      - name: Architecture boundaries
        run: pnpm architecture:boundary
      - name: Install reproducibly
        run: pnpm install --frozen-lockfile
      - name: Full dependency security audit
        run: pnpm security:audit
      - name: Generate production SBOM
        run: |
          node scripts/generate-sbom.mjs > /tmp/kingmast.cdx.json
          node -e "const b=require('/tmp/kingmast.cdx.json'); if(b.bomFormat!=='CycloneDX'||b.specVersion!=='1.5'||!Array.isArray(b.components)) process.exit(1); console.log('KINGMAST CycloneDX SBOM generated with '+b.components.length+' production components.');"
      - name: Agent skill contracts
        run: pnpm skills:validate
      - name: Safety boundary
        run: pnpm safety:boundary
      - name: Engineering evidence contracts
        run: pnpm evidence:validate
      - name: Vercel deployment policy
        run: pnpm vercel:policy
      - name: Python syntax
        run: python -m py_compile edge/camera-detector/detector.py edge/camera-detector/speed_sign_detector.py
      - name: Lint quality gate
        run: pnpm lint
      - name: TypeScript
        run: pnpm typecheck
      - name: Unit and contract tests
        run: pnpm test
      - name: Deterministic SIL replay evidence
        run: |
          pnpm --filter @kingmast/risk-engine exec tsx src/sil-replay-cli.ts > /tmp/kingmast.sil-replay.json
          node -e "const r=require('/tmp/kingmast.sil-replay.json'); if(r.schema!=='kingmast-sil-replay-report/v1'||r.controlAuthority!=='none'||r.total<7||r.failed!==0||r.allPassed!==true) process.exit(1); console.log('KINGMAST SIL replay passed '+r.passed+'/'+r.total+' cases.');"
      - name: Risk-core performance regression evidence
        run: |
          pnpm performance:risk-evidence > /tmp/kingmast.risk-performance.json
          node -e "const r=require('/tmp/kingmast.risk-performance.json'); if(r.schema!=='kingmast-risk-performance-report/v1'||r.controlAuthority!=='none'||r.qualificationClaim!=='ci-regression-only-not-target-hardware'||r.targetHardwareQualified!==false||r.classification?.passed!==true||r.timing?.passed!==true||r.allPassed!==true||r.latencyMs?.p99>r.budget?.p99Ms) process.exit(1); console.log('KINGMAST risk performance regression p99 '+r.latencyMs.p99+' ms within '+r.budget.p99Ms+' ms CI budget.');"
      - name: HIL evidence registry honesty gate
        run: pnpm hil:evidence
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=moderate
      - name: Production build
        run: pnpm build
      - name: Generate build provenance
        env:
          KINGMAST_SBOM_PATH: /tmp/kingmast.cdx.json
          KINGMAST_BUILD_PATHS: services/risk-engine/dist,apps/hmi/.next/BUILD_ID
        run: |
          node scripts/generate-build-provenance.mjs > /tmp/kingmast.provenance.json
          node -e "const p=require('/tmp/kingmast.provenance.json'); const names=new Set(p.materials.map(x=>x.name)); if(p.schema!=='kingmast-build-provenance/v1'||p.subject.commit!==process.env.GITHUB_SHA||p.assertions.actuatorAuthority!=='none'||!names.has('cyclonedx-sbom')||!names.has('services/risk-engine/dist')||!names.has('apps/hmi/.next/BUILD_ID')) process.exit(1); console.log('KINGMAST build provenance validated for '+p.subject.commit);"
      - name: Generate engineering evidence anchor
        env:
          KINGMAST_EVIDENCE_PATHS: /tmp/kingmast.cdx.json,/tmp/kingmast.provenance.json,/tmp/kingmast.sil-replay.json,/tmp/kingmast.risk-performance.json,docs/validation/hil/V006_HIL_EVIDENCE_REGISTRY.json,docs/validation/hil/V006_BOOT_SECURITY_EVIDENCE_REGISTRY.json,docs/updates/V006_FIRMWARE_TRUST_EVIDENCE.json
        run: |
          node scripts/generate-evidence-anchor.mjs > /tmp/kingmast.evidence-anchor.json
          node -e "const a=require('/tmp/kingmast.evidence-anchor.json'); if(a.schema!=='kingmast-evidence-anchor/v1'||a.sourceCommit!==process.env.GITHUB_SHA||a.actuatorAuthority!=='none'||a.externallySigned!==false||a.externalTimestampAuthority!=='none'||a.materials.length<7||!/^[a-f0-9]{64}$/.test(a.rootSha256)) process.exit(1); console.log('KINGMAST evidence anchor '+a.rootSha256+' binds '+a.materials.length+' materials.');"
      - name: Verify engineering evidence anchor
        env:
          KINGMAST_EVIDENCE_ANCHOR_PATH: /tmp/kingmast.evidence-anchor.json
          KINGMAST_EVIDENCE_PATHS: /tmp/kingmast.cdx.json,/tmp/kingmast.provenance.json,/tmp/kingmast.sil-replay.json,/tmp/kingmast.risk-performance.json,docs/validation/hil/V006_HIL_EVIDENCE_REGISTRY.json,docs/validation/hil/V006_BOOT_SECURITY_EVIDENCE_REGISTRY.json,docs/updates/V006_FIRMWARE_TRUST_EVIDENCE.json
        run: pnpm evidence:anchor-verify
      - name: Install Chromium for HMI verification
        run: pnpm --filter @kingmast/hmi exec playwright install --with-deps chromium
      - name: Run automotive HMI UI tests
        run: pnpm --filter @kingmast/hmi test:ui
      - name: Upload engineering evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kingmast-engineering-evidence-${{ github.run_id }}
          path: |
            /tmp/kingmast.cdx.json
            /tmp/kingmast.provenance.json
            /tmp/kingmast.sil-replay.json
            /tmp/kingmast.risk-performance.json
            /tmp/kingmast.evidence-anchor.json
            docs/validation/hil/V006_HIL_EVIDENCE_REGISTRY.json
            docs/validation/hil/V006_BOOT_SECURITY_EVIDENCE_REGISTRY.json
            docs/updates/V006_FIRMWARE_TRUST_EVIDENCE.json
          if-no-files-found: error
          retention-days: 14
