name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - name: Repository secret scan
        run: pnpm security:secrets
      - name: Firmware security policy
        run: pnpm firmware:policy
      - name: Install reproducibly
        run: pnpm install --frozen-lockfile
      - name: Generate production SBOM
        run: |
          pnpm supplychain:sbom > /tmp/kingmast.cdx.json
          node -e "const b=require('/tmp/kingmast.cdx.json'); if(b.bomFormat!=='CycloneDX'||b.specVersion!=='1.5'||!Array.isArray(b.components)) process.exit(1); console.log('KINGMAST CycloneDX SBOM generated with '+b.components.length+' production components.');"
      - name: Agent skill contracts
        run: pnpm skills:validate
      - name: Safety boundary
        run: pnpm safety:boundary
      - name: Engineering evidence contracts
        run: pnpm evidence:validate
      - name: Vercel deployment policy
        run: pnpm vercel:policy
      - name: Python syntax
        run: python -m py_compile edge/camera-detector/detector.py edge/camera-detector/speed_sign_detector.py
      - name: Lint quality gate
        run: pnpm lint
      - name: TypeScript
        run: pnpm typecheck
      - name: Unit and contract tests
        run: pnpm test
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=moderate
      - name: Production build
        run: pnpm build
      - name: Install Chromium for HMI verification
        run: pnpm --filter @kingmast/hmi exec playwright install --with-deps chromium
      - name: Run automotive HMI UI tests
        run: pnpm --filter @kingmast/hmi test:ui
