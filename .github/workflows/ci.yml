name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.34.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install reproducibly
        run: pnpm install --frozen-lockfile
      - name: Safety boundary
        run: pnpm safety:boundary
      - name: Python syntax
        run: python -m py_compile edge/camera-detector/detector.py edge/camera-detector/speed_sign_detector.py
      - name: Lint quality gate
        run: pnpm lint
      - name: TypeScript
        run: pnpm typecheck
      - name: Unit and contract tests
        run: pnpm test
      - name: Production dependency audit
        run: |
          pnpm audit --prod || true
          pnpm audit --prod --audit-level=high
      - name: Production build
        run: pnpm build
      - name: Install Chromium for HMI verification
        run: pnpm --filter @kingmast/hmi exec playwright install --with-deps chromium
      - name: Run automotive HMI UI tests
        run: pnpm --filter @kingmast/hmi test:ui
