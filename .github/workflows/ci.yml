name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - name: Repository secret scan
        run: pnpm security:secrets
      - name: Workflow supply-chain policy
        run: pnpm security:workflow-policy
      - name: Configuration auth policy
        run: pnpm security:config-auth
      - name: Provider identity policy
        run: pnpm security:provider-auth
      - name: Fastify route rate-limit policy
        run: pnpm security:route-rate-limit
      - name: Audit integrity policy
        run: pnpm audit:integrity
      - name: Firmware security policy
        run: pnpm firmware:policy
      - name: Firmware trust evidence honesty gate
        run: pnpm firmware:evidence
      - name: Physical boot security evidence honesty gate
        run: pnpm boot:evidence
      - name: A/B recovery policy
        run: pnpm ota:recovery-policy
      - name: Release identity and evidence policy
        run: pnpm release:identity-policy
      - name: Release qualification matrix
        run: pnpm qualification:release
      - name: Gate-3 acceptance honesty policy
        run: pnpm qualification:gate3
      - name: Target vehicle-computer soak evidence honesty policy
        run: pnpm qualification:target-soak
      - name: Detached evidence signing self-test
        run: pnpm evidence:signing-selftest
      - name: Architecture boundaries
        run: pnpm architecture:boundary
      - name: Install reproducibly
        run: pnpm install --frozen-lockfile
      - name: Full dependency security audit
        run: pnpm security:audit
      - name: Generate production SBOM
        run: |
          node scripts/generate-sbom.mjs > /tmp/kingmast.cdx.json
          node -e "const b=require('/tmp/kingmast.cdx.json'); if(b.bomFormat!=='CycloneDX'||b.specVersion!=='1.5'||!Array.isArray(b.components)) process.exit(1); console.log('KINGMAST CycloneDX SBOM generated with '+b.components.length+' production components.');"
      - name: Agent skill contracts
        run: pnpm skills:validate
      - name: Safety boundary
        run: pnpm safety:boundary
      - name: Engineering evidence contracts
        run: pnpm evidence:validate
      - name: Expert and OEM clean-room traceability
        run: pnpm evidence:oem-traceability
      - name: HMI design-system contract
        run: pnpm hmi:design-system
      - name: HMI Next 16 and TypeScript 7 policy
        run: pnpm toolchain:hmi-policy
      - name: Vercel deployment policy
        run: pnpm vercel:policy
      - name: Python syntax
        run: python -m py_compile edge/camera-detector/detector.py edge/camera-detector/speed_sign_detector.py
      - name: Lint quality gate
        run: pnpm lint
      - name: TypeScript
        run: pnpm typecheck
      - name: Unit and contract tests
        run: pnpm test
      - name: HMI structural human-factors evidence
        run: |
          node apps/hmi/scripts/human-factors-evidence.mjs > /tmp/kingmast.hmi-human-factors.json
          node -e "const r=require('/tmp/kingmast.hmi-human-factors.json'); if(r.schema!=='kingmast-hmi-human-factors-evidence/v1'||r.controlAuthority!=='none'||r.qualificationClaim!=='ci-structural-only-not-user-study'||r.humanFactorsValidated!==false||r.userStudyEvidence!==false||r.allStructuralChecksPassed!==true||r.failedStructuralChecks!==0||r.structuralCheckCount<10) process.exit(1); console.log('KINGMAST HMI structural human-factors evidence passed '+r.passedStructuralChecks+'/'+r.structuralCheckCount+' checks without claiming a user study.');"
      - name: Deterministic SIL replay evidence
        run: |
          pnpm --filter @kingmast/risk-engine exec tsx src/sil-replay-cli.ts > /tmp/kingmast.sil-replay.json
          node -e "const r=require('/tmp/kingmast.sil-replay.json'); if(r.schema!=='kingmast-sil-replay-report/v1'||r.controlAuthority!=='none'||r.total<7||r.failed!==0||r.allPassed!==true) process.exit(1); console.log('KINGMAST SIL replay passed '+r.passed+'/'+r.total+' cases.');"
      - name: Risk-core performance regression evidence
        run: |
          pnpm --filter @kingmast/risk-engine exec tsx src/performance-evidence-cli.ts > /tmp/kingmast.risk-performance.json
          node -e "const r=require('/tmp/kingmast.risk-performance.json'); if(r.schema!=='kingmast-risk-performance-report/v1'||r.controlAuthority!=='none'||r.qualificationClaim!=='ci-regression-only-not-target-hardware'||r.targetHardwareQualified!==false||r.classification?.passed!==true||r.timing?.passed!==true||r.allPassed!==true||r.latencyMs?.p99>r.budget?.p99Ms) process.exit(1); console.log('KINGMAST risk performance regression p99 '+r.latencyMs.p99+' ms within '+r.budget.p99Ms+' ms CI budget.');"
      - name: Vehicle-computer host soak regression evidence
        env:
          KINGMAST_HOST_SOAK_SECONDS: 3
          KINGMAST_HOST_SOAK_MEMORY_GROWTH_MIB: 96
          KINGMAST_HOST_SOAK_EVENT_LOOP_P99_MS: 250
        run: |
          pnpm --filter @kingmast/risk-engine exec tsx src/host-soak-evidence-cli.ts > /tmp/kingmast.host-soak.json
          node -e "const r=require('/tmp/kingmast.host-soak.json'); if(r.schema!=='kingmast-host-soak-report/v1'||r.controlAuthority!=='none'||r.qualificationClaim!=='ci-host-soak-regression-only-not-target-hardware'||r.targetHardwareQualified!==false||r.physicalVehicleComputerTest!==false||r.physicalPreflight?.passed!==true||r.classification?.passed!==true||r.memory?.passed!==true||r.eventLoop?.passed!==true||r.allPassed!==true||r.workload?.operations<1) process.exit(1); console.log('KINGMAST host soak regression passed '+r.workload.operations+' risk operations in '+r.workload.durationSeconds+' s; RSS growth '+r.memory.rssGrowthMiB+' MiB.');"
      - name: Bounded field diagnostics evidence
        env:
          KINGMAST_PRODUCT_VERSION: 0.0.6
          KINGMAST_BUILD_COMMIT: ${{ github.sha }}
          KINGMAST_BUILD_ID: ci-${{ github.run_id }}
          KINGMAST_FIELD_DIAGNOSTICS_INPUT_JSON: '{"edge":{"status":"offline","rejectedPackets":0,"sensorAgesMs":{"gnss":null,"radarFront":null,"camera":null}},"providerTrust":{"authRejected":0,"replayRejected":0,"capacityRejected":0,"providers":[]}}'
        run: |
          pnpm --silent diagnostics:field-evidence > /tmp/kingmast.field-diagnostics.json
          node -e "const r=require('/tmp/kingmast.field-diagnostics.json'); const p=r.privacy||{}; if(r.schema!=='kingmast-field-diagnostics-report/v1'||r.controlAuthority!=='none'||r.qualificationClaim!=='ci-software-contract-only-not-physical-field-evidence'||r.targetHardwareQualified!==false||r.physicalVehicleComputerTest!==false||r.physicalCaptureReady!==false||r.allPassed!==true||p.rawCabinVideoIncluded!==false||p.rawCameraFramesIncluded!==false||p.preciseCoordinatesIncluded!==false||p.requestPayloadsIncluded!==false||p.secretsIncluded!==false||p.rawHardwareSerialIncluded!==false) process.exit(1); console.log('KINGMAST bounded field diagnostics software contract passed; physical capture remains pending.');"
      - name: Realtime reconnect and HMI transport evidence
        run: |
          pnpm --filter @kingmast/risk-engine exec tsx src/realtime-recovery-evidence-cli.ts > /tmp/kingmast.realtime-recovery.json
          node -e "const r=require('/tmp/kingmast.realtime-recovery.json'); if(r.schema!=='kingmast-realtime-recovery-report/v1'||r.controlAuthority!=='none'||r.qualificationClaim!=='deterministic-software-recovery-only-not-physical-hil'||r.physicalControllerTest!==false||r.targetHardwareQualified!==false||r.browserNetworkMeasured!==false||r.allPassed!==true) process.exit(1); console.log('KINGMAST realtime recovery evidence passed with '+r.snapshot.reconnects+' reconnect and '+r.snapshot.sequenceRegressions+' rejected sequence regression.');"
      - name: Realtime edge-to-stream loopback integration evidence
        run: |
          pnpm --filter @kingmast/risk-engine exec tsx src/realtime-integration-evidence-cli.ts > /tmp/kingmast.realtime-loopback.json
          node -e "const r=require('/tmp/kingmast.realtime-loopback.json'); if(r.schema!=='kingmast-realtime-loopback-integration-report/v1'||r.controlAuthority!=='none'||r.qualificationClaim!=='ci-loopback-process-integration-only-not-target-hardware'||r.physicalControllerTest!==false||r.targetHardwareQualified!==false||r.browserRenderMeasured!==false||r.allPassed!==true||r.snapshot?.reconnects!==1||r.snapshot?.sessionChanges!==1) process.exit(1); console.log('KINGMAST realtime loopback integration passed; restart ready '+r.restartReadyMs+' ms, post-restart transport '+r.postRestartServerToClientMs+' ms.');"
      - name: Realtime resilience policy
        run: pnpm realtime:policy
      - name: HIL evidence registry honesty gate
        run: pnpm hil:evidence
      - name: HIL physical evidence package template gate
        run: pnpm hil:package-check
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=moderate
      - name: Production build
        run: pnpm build
      - name: Generate build provenance
        env:
          KINGMAST_SBOM_PATH: /tmp/kingmast.cdx.json
          KINGMAST_BUILD_PATHS: services/risk-engine/dist,apps/hmi/.next/BUILD_ID
        run: |
          node scripts/generate-build-provenance.mjs > /tmp/kingmast.provenance.json
          node -e "const p=require('/tmp/kingmast.provenance.json'); const names=new Set(p.materials.map(x=>x.name)); if(p.schema!=='kingmast-build-provenance/v1'||p.subject.commit!==process.env.GITHUB_SHA||p.assertions.actuatorAuthority!=='none'||!names.has('cyclonedx-sbom')||!names.has('services/risk-engine/dist')||!names.has('apps/hmi/.next/BUILD_ID')) process.exit(1); console.log('KINGMAST build provenance validated for '+p.subject.commit);"
      - name: Install Chromium for HMI verification
        run: pnpm --filter @kingmast/hmi exec playwright install --with-deps chromium
      - name: HMI performance regression evidence
        env:
          KINGMAST_HMI_PERFORMANCE_EVIDENCE: '1'
          KINGMAST_HMI_PERFORMANCE_OUTPUT: performance-evidence.json
        run: |
          pnpm --filter @kingmast/hmi performance:evidence
          node -e "const r=require('./apps/hmi/performance-evidence.json'); if(r.schema!=='kingmast-hmi-performance-report/v1'||r.controlAuthority!=='none'||r.qualificationClaim!=='ci-browser-regression-only-not-target-display-or-vehicle-computer'||r.targetHardwareQualified!==false||r.physicalVehicleComputerTest!==false||r.allPassed!==true||r.rendererFallback?.passed!==true) process.exit(1); console.log('KINGMAST HMI performance regression boot '+r.latency.bootToReadyMs+' ms, frame p99 '+r.frameTiming.p99Ms+' ms, renderer fallback '+r.rendererFallback.mode+'.');"
      - name: Generate engineering evidence anchor
        env:
          KINGMAST_EVIDENCE_PATHS: /tmp/kingmast.cdx.json,/tmp/kingmast.provenance.json,/tmp/kingmast.hmi-human-factors.json,/tmp/kingmast.sil-replay.json,/tmp/kingmast.risk-performance.json,/tmp/kingmast.host-soak.json,/tmp/kingmast.field-diagnostics.json,/tmp/kingmast.realtime-recovery.json,/tmp/kingmast.realtime-loopback.json,apps/hmi/performance-evidence.json,docs/validation/V006_RELEASE_QUALIFICATION_MATRIX.json,docs/validation/V006_GATE3_ACCEPTANCE_CRITERIA.json,docs/validation/GATE3_ACCEPTANCE_PACK_V006.md,docs/validation/runtime/V006_TARGET_SOAK_CAPTURE.json,docs/validation/hil/V006_HIL_EVIDENCE_REGISTRY.json,docs/validation/hil/V006_BOOT_SECURITY_EVIDENCE_REGISTRY.json,docs/updates/V006_FIRMWARE_TRUST_EVIDENCE.json
        run: |
          node scripts/generate-evidence-anchor.mjs > /tmp/kingmast.evidence-anchor.json
          node -e "const a=require('/tmp/kingmast.evidence-anchor.json'); if(a.schema!=='kingmast-evidence-anchor/v1'||a.sourceCommit!==process.env.GITHUB_SHA||a.actuatorAuthority!=='none'||a.externallySigned!==false||a.externalTimestampAuthority!=='none'||a.materials.length<17||!/^[a-f0-9]{64}$/.test(a.rootSha256)) process.exit(1); console.log('KINGMAST evidence anchor '+a.rootSha256+' binds '+a.materials.length+' materials.');"
      - name: Verify engineering evidence anchor
        env:
          KINGMAST_EVIDENCE_ANCHOR_PATH: /tmp/kingmast.evidence-anchor.json
          KINGMAST_EVIDENCE_PATHS: /tmp/kingmast.cdx.json,/tmp/kingmast.provenance.json,/tmp/kingmast.hmi-human-factors.json,/tmp/kingmast.sil-replay.json,/tmp/kingmast.risk-performance.json,/tmp/kingmast.host-soak.json,/tmp/kingmast.field-diagnostics.json,/tmp/kingmast.realtime-recovery.json,/tmp/kingmast.realtime-loopback.json,apps/hmi/performance-evidence.json,docs/validation/V006_RELEASE_QUALIFICATION_MATRIX.json,docs/validation/V006_GATE3_ACCEPTANCE_CRITERIA.json,docs/validation/GATE3_ACCEPTANCE_PACK_V006.md,docs/validation/runtime/V006_TARGET_SOAK_CAPTURE.json,docs/validation/hil/V006_HIL_EVIDENCE_REGISTRY.json,docs/validation/hil/V006_BOOT_SECURITY_EVIDENCE_REGISTRY.json,docs/updates/V006_FIRMWARE_TRUST_EVIDENCE.json
        run: pnpm evidence:anchor-verify
      - name: Run automotive HMI UI tests
        run: pnpm --filter @kingmast/hmi test:ui
      - name: Upload engineering evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kingmast-engineering-evidence-${{ github.run_id }}
          path: |
            /tmp/kingmast.cdx.json
            /tmp/kingmast.provenance.json
            /tmp/kingmast.hmi-human-factors.json
            /tmp/kingmast.sil-replay.json
            /tmp/kingmast.risk-performance.json
            /tmp/kingmast.host-soak.json
            /tmp/kingmast.field-diagnostics.json
            /tmp/kingmast.realtime-recovery.json
            /tmp/kingmast.realtime-loopback.json
            apps/hmi/performance-evidence.json
            /tmp/kingmast.evidence-anchor.json
            docs/validation/V006_RELEASE_QUALIFICATION_MATRIX.json
            docs/validation/V006_GATE3_ACCEPTANCE_CRITERIA.json
            docs/validation/GATE3_ACCEPTANCE_PACK_V006.md
            docs/validation/runtime/V006_TARGET_SOAK_CAPTURE.json
            docs/validation/hil/V006_HIL_EVIDENCE_REGISTRY.json
            docs/validation/hil/V006_BOOT_SECURITY_EVIDENCE_REGISTRY.json
            docs/updates/V006_FIRMWARE_TRUST_EVIDENCE.json
          if-no-files-found: error
          retention-days: 14
