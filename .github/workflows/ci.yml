name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.34.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install and refresh lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Commit regenerated lockfile on hardening PR
        if: github.event_name == 'pull_request' && github.head_ref == 'chore/ci-security-hardening'
        run: |
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore(deps): refresh pnpm lockfile"
            git push origin HEAD:chore/ci-security-hardening
          fi
      - name: Safety boundary
        run: pnpm safety:boundary
      - name: Python syntax
        run: python -m py_compile edge/camera-detector/detector.py edge/camera-detector/speed_sign_detector.py
      - name: Lint quality gate
        run: pnpm lint
      - name: TypeScript
        run: pnpm typecheck
      - name: Unit and contract tests
        run: pnpm test
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=moderate
      - name: Production build
        run: pnpm build
      - name: Install Chromium for HMI verification
        run: pnpm --filter @kingmast/hmi exec playwright install --with-deps chromium
      - name: Run automotive HMI UI tests
        run: pnpm --filter @kingmast/hmi test:ui
