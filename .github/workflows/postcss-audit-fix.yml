name: PostCSS audit fix verification
on:
  push:
    branches:
      - fix/postcss-audit-20260904
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Refresh lockfile for security override
        run: pnpm install --lockfile-only --frozen-lockfile=false
      - name: Install reproducibly
        run: pnpm install --frozen-lockfile
      - name: Safety boundary
        run: pnpm safety:boundary
      - name: Python syntax
        run: python -m py_compile edge/camera-detector/detector.py edge/camera-detector/speed_sign_detector.py
      - name: Lint quality gate
        run: pnpm lint
      - name: TypeScript
        run: pnpm typecheck
      - name: Unit and contract tests
        run: pnpm test
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=high
      - name: Production build
        run: pnpm build
      - name: Install Chromium for HMI verification
        run: pnpm --filter @kingmast/hmi exec playwright install --with-deps chromium
      - name: Run automotive HMI UI tests
        run: pnpm --filter @kingmast/hmi test:ui
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(deps): refresh lockfile for PostCSS security override"
          git push
