name: Pi Storage
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify-pi-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Python syntax
        run: python -m py_compile edge/pi-storage/storage_runtime.py edge/pi-storage/history_gateway.py edge/pi-storage/test_storage_runtime.py edge/pi-storage/test_history_gateway.py
      - name: Adaptive storage and history authentication tests
        working-directory: edge/pi-storage
        run: python -m unittest -v test_storage_runtime.py test_history_gateway.py
