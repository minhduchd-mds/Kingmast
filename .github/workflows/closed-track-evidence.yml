name: Controlled Track Evidence

on:
  workflow_dispatch:
    inputs:
      scenario_id:
        description: Already completed controlled-track scenario to package
        required: true
        type: choice
        options:
          - CT-001
          - CT-002
          - CT-003
          - CT-004
          - CT-005
          - CT-006
          - CT-007
          - CT-008
      acknowledge_existing_physical_capture:
        description: I confirm an independently approved physical controlled-track capture already exists; this workflow does not authorize a test run or road use
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: kingmast-controlled-track-evidence
  cancel-in-progress: false

jobs:
  package-evidence:
    if: ${{ inputs.acknowledge_existing_physical_capture == true }}
    runs-on: [self-hosted, linux, kingmast-track-evidence]
    environment: closed-track-evidence
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install reproducibly
        run: pnpm install --frozen-lockfile
      - name: Repository and controlled-track honesty gates
        run: |
          pnpm security:secrets
          pnpm security:workflow-policy
          pnpm safety:boundary
          pnpm qualification:closed-track
      - name: Package existing physical controlled-track capture
        env:
          KINGMAST_CLOSED_TRACK_SCENARIO_ID: ${{ inputs.scenario_id }}
          KINGMAST_CLOSED_TRACK_CAPTURE_ROOT: /var/lib/kingmast/closed-track-captures
          KINGMAST_CLOSED_TRACK_OUTPUT_PATH: ${{ runner.temp }}/kingmast.closed-track-physical-package.json
        run: pnpm qualification:closed-track-package
      - name: Assert evidence-only boundaries
        run: |
          node <<'NODE'
          const r=require(process.env.RUNNER_TEMP+'/kingmast.closed-track-physical-package.json');
          if(r.schema!=='kingmast-closed-track-evidence-package/v1'||r.claim!=='physical-controlled-track-result'||r.controlAuthority!=='none'||r.closedTrackApproved!==false||r.targetHardwareQualified!==false||r.publicRoadApproved!==false||r.reviewDisposition!=='captured-awaiting-independent-review')process.exit(1);
          console.log(`KINGMAST ${r.scenarioId} controlled-track evidence packaged; independent review remains required and no road authorization is created.`);
          NODE
      - name: Upload bounded controlled-track evidence package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kingmast-controlled-track-${{ inputs.scenario_id }}-${{ github.run_id }}
          path: ${{ runner.temp }}/kingmast.closed-track-physical-package.json
          if-no-files-found: error
          retention-days: 30
